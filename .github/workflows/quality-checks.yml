name: Smart Ledger quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conversation-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/context-engine.js
          node --check assets/js/intent-adapter.js
          node --check assets/js/conversation-test.js
          node --check assets/js/provider-bridge.js
          node --check cloudflare/worker/src/index.mjs
          node --check preview/assets/js/ledger-core.js
          node --check preview/assets/js/ledger-repository.js
          node --check preview/assets/js/ledger-authz.js
          node --check preview/assets/js/app.js
      - name: Run finance conversation scenarios
        run: node --test tests/context-engine.test.cjs tests/intent-adapter.test.cjs tests/conversation-ui.test.cjs tests/worker-bridge.test.mjs tests/rbac.test.cjs tests/ui-shell.test.cjs
