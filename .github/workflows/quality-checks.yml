name: Smart Ledger quality checks

on:
  push:
    branches: [main, foundation-v2]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/ledger-core.js
          node --check assets/js/ledger-repository.js
          node --check assets/js/app.js
      - name: Run finance regression tests
        run: node --test tests/ledger-core.test.cjs tests/ledger-repository.test.cjs
